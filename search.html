<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./img/soundiq.png">
    <title>Soundiq | Search</title>
</head>
<body>
    <div class="lang-switcher-container">
    <select id="langSelect" onchange="changeLanguage(this.value)">
        <option value="pl">PL</option>
        <option value="en">EN</option>
        <option value="de">DE</option>
        <option value="es">ES</option>
        <option value="it">IT</option>
        <option value="cs">CS</option>
        <option value="ja">JA</option>
        <option value="ar">AR</option>
    </select>
</div>
    <div class="sidebar">
        <img src="img/soundiq.png" alt="">
        <div class="logo">Soundiq</div>
        <div class="menu-item translate-me" onclick="home()">Home</div>
        <div class="menu-item translate-me" onclick="searchSong()">Szukaj</div>
        <div class="menu-item fav-link translate-me" onclick="openFavourites()">&#9829; Polubione</div>
        <div class="menu-item translate-me" onclick="viewCustomPlaylistDirectly">+ Stwórz własną playlistę</div>
        <div id="customPlaylistsContainer"></div>
</div>
    <div class="main2">
        <input id="searchInput" type="text" placeholder="Search...">
        <ul id="songList">
        </ul>
            <div class="bottom-player">
        <div class="player-left">
            <div class="track-info">
                <div id="playerTitle" class="player-track-title translate-me">Brak utworu</div>
                <div id="playerArtist" class="player-track-artist">-</div>
            </div>
            <button id="playerFavBtn" class="player-fav-btn">♥</button>
        </div>
<div class="player-center">
            <div class="control-buttons">
                <button id="prevBtn" title="Poprzedni utwór" onclick="playPrev()">⏮</button>
                <button id="masterPlayBtn" title="Odtwórz / Pauza" onclick="toggleMasterPlay()">▶</button>
                <button id="nextBtn" title="Następny utwór" onclick="playNext()">⏭</button>
            </div>
            <div class="player-bar">
                <span class="time-label" id="currentTime">0:00</span>
                <div id="progressBar">
                    <div class="wave-container wave-hidden" id="barWave">
                        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
                        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
                        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
                        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
                        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
                        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
                    </div>
                    <div id="progressFill"></div>
                </div>
                <span class="time-label" id="totalTime">0:00</span>
            </div>
        </div>

        <div class="player-right"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
